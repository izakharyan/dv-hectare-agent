[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvhectare"
version = "0.1.0"
description = "Поиск свободной земли под «Дальневосточный гектар» по данным НСПД (ex-ПКК)"
requires-python = ">=3.10"
dependencies = [
    "httpx[socks]>=0.27",   # socks — чтобы прокси можно было задавать как socks5://
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "pyogrio>=0.7", "folium>=0.16"]
agent = ["google-genai>=2.0"]
gui = ["pywebview>=6.0"]
dev = ["pytest>=8"]

[project.scripts]
dvhectare = "dvhectare.cli:main"

[project.gui-scripts]
dvhectare-gui = "dvhectare.gui:main"

[tool.setuptools.packages.find]
include = ["dvhectare*"]

[tool.setuptools.package-data]
dvhectare = ["gui_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
