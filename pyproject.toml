[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvhectare"
version = "0.1.0"
description = "Поиск свободной земли под «Дальневосточный гектар» по данным НСПД (ex-ПКК)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "pyogrio>=0.7", "folium>=0.16"]
agent = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
dvhectare = "dvhectare.cli:main"

[tool.setuptools.packages.find]
include = ["dvhectare*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
